server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json text/csv image/svg+xml;
    gzip_min_length 1024;

    # Asset names carry no content hash (vite.config.ts) and the data changes
    # daily, so every response is revalidated against its ETag.
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # .geojson and .csv are not in nginx's mime.types; a server-level types {}
    # block would replace the whole table, so set them per location instead.
    location ~ \.geojson$ {
        default_type application/geo+json;
    }

    location ~ \.csv$ {
        default_type "text/csv; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
