server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # No request logs: heisseluft.org's privacy policy states that loading the
    # map stores no personal data on our side, and access logs carry the IP.
    access_log off;
    log_not_found off;

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json text/csv image/svg+xml;
    gzip_min_length 1024;

    # Asset names carry no content hash (vite.config.ts) and the data changes
    # daily, so every response is revalidated against its ETag.
    add_header Cache-Control "no-cache" always;

    # heisseluft.org embeds the map in an iframe sandboxed without
    # allow-same-origin, so it runs with a null origin and every
    # `crossorigin` script/stylesheet and data fetch is a CORS request.
    # Public static content, same as GitHub Pages serves it.
    add_header Access-Control-Allow-Origin "*" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # .geojson and .csv are not in nginx's mime.types; a server-level types {}
    # block would replace the whole table, so set them per location instead.
    location ~ \.geojson$ {
        default_type application/geo+json;
    }

    location ~ \.csv$ {
        default_type "text/csv; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
